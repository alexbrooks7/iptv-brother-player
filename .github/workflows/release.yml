name: Release APK

# Tag-triggered, not push-triggered. Publishing a build that strangers will
# sideload onto their TV should be a deliberate act, not a side effect of
# every commit to main.
#
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  # Needed to create the release and attach the APKs to it.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Fail early and loudly rather than shipping an unsignable-for-upgrade
      # build. Without a real key, app/build.gradle.kts falls back to the
      # debug keystore — and on a CI runner that keystore is generated fresh
      # for every single run. Each release would then carry a *different*
      # signature, and Android refuses to upgrade an installed app whose
      # signature changed. Every user would have to uninstall (losing their
      # playlists, favourites and watch history) just to take an update. A
      # broken release job is a far better outcome than that.
      - name: Require a real signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No KEYSTORE_BASE64 secret set. See README 'Publishing a release'."
            echo "Releasing without a stable signing key would give every build a"
            echo "different signature, forcing users to uninstall to update."
            exit 1
          fi

      # Also required, and for a reason learned the hard way: v1.0.0 shipped
      # with the Pawns SDK bundled but its API key blank, because CI has no
      # local.properties. PawnsManager.available was therefore false in the
      # released binary — no consent prompt, no sharing, no revenue — and the
      # app looked completely healthy while doing none of it. Analytics was
      # dead in exactly the same way.
      #
      # `build.yml` deliberately builds *without* these, to prove a fresh
      # clone still compiles with both features off. That check is valuable
      # and stays. It is the release job that must be the opposite: a shipped
      # artifact silently missing the feature it is funded by is far worse
      # than a release that refuses to build.
      - name: Require the runtime API keys
        env:
          PAWNS_API_KEY: ${{ secrets.PAWNS_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          missing=""
          [ -z "$PAWNS_API_KEY" ] && missing="$missing PAWNS_API_KEY"
          [ -z "$POSTHOG_API_KEY" ] && missing="$missing POSTHOG_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — see README 'Publishing a release'."
            echo "Without these the release APK bundles the SDKs but disables them:"
            echo "no consent prompt, no bandwidth sharing, no analytics."
            exit 1
          fi

      # The keystore and its passwords come from repository secrets and are
      # written to files the Gradle build already knows how to read. They are
      # never echoed, and both files are on the runner only, which is
      # destroyed when the job ends.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # app/build.gradle.kts reads both keys out of local.properties, which is
      # gitignored and therefore absent on a runner. Writing it here is what
      # makes the released binary actually contain them.
      - name: Restore runtime API keys
        env:
          PAWNS_API_KEY: ${{ secrets.PAWNS_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        # POSTHOG_HOST is optional — unset means the build default
        # (https://us.i.posthog.com), which is the right value for a US
        # project. Written with an `if` rather than `[ -n "$X" ] && echo`:
        # steps run under `set -e`, and a trailing test that evaluates false
        # makes the whole script exit non-zero, so the optional line failed
        # the step precisely when the secret was correctly absent. An `if`
        # returns 0 when its condition is false.
        run: |
          {
            echo "pawns.apiKey=$PAWNS_API_KEY"
            echo "posthog.apiKey=$POSTHOG_API_KEY"
            if [ -n "$POSTHOG_HOST" ]; then
              echo "posthog.host=$POSTHOG_HOST"
            fi
          } >> local.properties

      - name: Test before shipping
        run: ./gradlew :app:testDebugUnitTest

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      # The failure this whole job exists to prevent is a *silently* feature-
      # less APK, so the build claiming success is not sufficient evidence.
      # This greps the compiled dex for the key that must be embedded, which
      # is the same check that caught v1.0.0 after the fact — run here so it
      # can never ship unnoticed again.
      - name: Verify keys are actually embedded in the APK
        env:
          PAWNS_API_KEY: ${{ secrets.PAWNS_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          workdir=$(mktemp -d)
          unzip -o -q app/build/outputs/apk/release/app-release.apk 'classes*.dex' -d "$workdir"
          for pair in "PAWNS:$PAWNS_API_KEY" "POSTHOG:$POSTHOG_API_KEY"; do
            label=${pair%%:*}
            value=${pair#*:}
            if grep -qF "$value" "$workdir"/classes*.dex; then
              echo "OK: $label key is embedded in the release APK"
            else
              echo "::error::$label key is NOT in the built APK — the app would ship with that feature silently disabled."
              rm -rf "$workdir"
              exit 1
            fi
          done
          rm -rf "$workdir"

      # Renamed to a fixed, version-free filename on purpose. The permanent
      # download URL is
      #   /releases/latest/download/iptv-brother-player.apk
      # and that only keeps working if the asset name never changes between
      # releases. Putting the version in the filename would break the link on
      # every release, which defeats the point of having one.
      - name: Stage APK under a stable name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             dist/iptv-brother-player.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            One universal APK — runs identically on Android TV, Google TV and
            Amazon Fire TV. Sideload only; not distributed through any store.

            Always-latest download link:
            https://github.com/alexbrooks7/iptv-brother-player/releases/latest/download/iptv-brother-player.apk

            This app ships with no channels, no content and no provider. You
            supply your own playlist.

      # The keystore is on an ephemeral runner that is discarded anyway, but
      # deleting it explicitly means a later step added to this job can never
      # accidentally archive or print it.
      - name: Shred signing material
        if: always()
        run: rm -f release.keystore keystore.properties
