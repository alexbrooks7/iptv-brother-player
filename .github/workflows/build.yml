name: Build & test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Matches compileOptions/jvmTarget in app/build.gradle.kts. If those
          # move, this has to move with them.
          java-version: "17"

      # Deliberately no `gradle-version` here: setup-gradle then uses the
      # repo's own wrapper (gradle/wrapper/gradle-wrapper.properties), so CI
      # builds with exactly the Gradle this project is developed against.
      # Pinning a separate version is how the sibling Drift repo's CI broke —
      # it sat at Gradle 8.10 while AGP moved to 8.9.1, which needs 8.11.1+.
      # This project has already made that same AGP jump, for the Pawns SDK.
      - uses: gradle/actions/setup-gradle@v6

      # The Android SDK is preinstalled on ubuntu-latest runners, so there is
      # no local.properties on CI — which is the point. Both `pawns.apiKey`
      # and `posthog.apiKey` are therefore blank, and every build below proves
      # the app still compiles with internet sharing and analytics fully
      # disabled. That fail-closed path is what a fresh clone gets, and it is
      # otherwise never exercised on a developer machine that has the keys.
      #
      # Both flavours are built explicitly (`:app:testDebugUnitTest` etc. are
      # ambiguous once a flavour dimension exists — Gradle refuses to guess).
      - name: Unit tests
        run: ./gradlew :app:testSideloadDebugUnitTest :app:testStoreDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew :app:assembleSideloadDebug :app:assembleStoreDebug

      # Release is built too, and not for the artifact — it is the only
      # variant that runs R8. The Pawns SDK is reached by name from the
      # manifest and its DTOs cross a serialization boundary, so a wrong keep
      # rule in proguard-rules.pro breaks sharing only in release, where the
      # app otherwise looks perfectly healthy. Catching that here is cheaper
      # than catching it after handing someone a broken sideload.
      - name: Build release (exercises R8 / ProGuard rules)
        run: ./gradlew :app:assembleSideloadRelease :app:assembleStoreRelease

      # The store flavour exists to satisfy Play/Amazon policy against apps
      # that route other users' traffic through a device, and that policy is
      # about what ships, not about a runtime flag — so the proof has to be
      # "the SDK's classes are not in this APK", checked on every push. This
      # needs no secrets and catches the mistake regardless of who makes it:
      # someone moving PawnsManager back into src/main, or the dependency
      # back to an unconditional `implementation` in build.gradle.kts, would
      # both slip past every other check here.
      - name: Verify the store build has no trace of the Pawns SDK
        run: |
          workdir=$(mktemp -d)
          unzip -o -q app/build/outputs/apk/store/release/app-store-release.apk 'classes*.dex' -d "$workdir"
          if grep -qa "com/pawns/sdk" "$workdir"/classes*.dex; then
            echo "::error::Pawns SDK classes found in the store build — this must never ship to Play or Amazon."
            rm -rf "$workdir"
            exit 1
          fi
          echo "OK: no Pawns SDK classes in the store build"
          rm -rf "$workdir"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: iptv-brother-player-debug-apks
          path: |
            app/build/outputs/apk/sideload/debug/app-sideload-debug.apk
            app/build/outputs/apk/store/debug/app-store-debug.apk

      # Only on failure: a red run is useless without the report that says
      # which assertion broke, and on a TV app most contributors will not have
      # a local Android toolchain to reproduce it with.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
